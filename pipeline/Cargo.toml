[workspace]
resolver = "2"
members = ["common", "bronze", "silver", "gold"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["alfredodeza@gmail.com"]
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
polars = { version = "0.55.2", features = ["lazy", "csv", "parquet", "strings"] }

[profile.release]
opt-level = 3
lto = true
